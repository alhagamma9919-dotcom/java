<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Comfy Remote</title>
<style>
:root{--bg:#0e1116;--card:#171b22;--card2:#1f252e;--line:#2a313b;--text:#e8ecf1;--mute:#8a94a3;--acc:#7aa7ff;--acc2:#a78bfa;--ok:#4cc38a;--warn:#f5b454;--bad:#ff6b6b;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0 auto;max-width:760px;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 14px calc(110px + env(safe-area-inset-bottom))}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],input[type=number],input[type=password],textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:120px;resize:vertical}
button{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;white-space:nowrap}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;pointer-events:none}
button.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#0b1020;font-weight:700}
button.ok{border-color:#2d6b4f;color:var(--ok)}
button.bad{border-color:#6b2d2d;color:var(--bad)}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
.mute{color:var(--mute);font-size:13px}
.err{color:var(--bad);white-space:pre-wrap;font-size:13px}
.hide{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.card>h3,details>summary{margin:0 0 4px;font-size:12px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
details>summary{cursor:pointer;list-style:none;margin:0}
details>summary::before{content:"▸ "}details[open]>summary::before{content:"▾ "}
label.f{display:flex;justify-content:space-between;gap:8px;margin:12px 0 5px;font-size:13px;color:var(--mute)}
label.f b{color:var(--text);font-weight:500}
/* header */
header{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 85%,transparent);padding:calc(10px + env(safe-area-inset-top)) 0 6px}
.pc{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute);flex:0 0 auto}
.dot.running{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.dot.starting{background:var(--warn);animation:pulse 1s infinite}
.dot.stopped{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.pc .t{flex:1;min-width:0}
.pc .t b{display:block;font-size:15px}
.pc .t span{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tabs{display:flex;gap:4px;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;padding:8px 4px;font-size:13px;color:var(--mute)}
.tabs button.on{background:var(--card2);color:var(--text)}
.tabs .badge{display:inline-block;min-width:16px;padding:0 4px;margin-left:3px;border-radius:8px;background:var(--acc);color:#0b1020;font-size:11px;font-weight:700}
/* form */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:0 0 auto;border-radius:20px;padding:7px 14px;font-size:13px}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#0b1020;font-weight:600}
.drop{border:1px dashed var(--line);border-radius:12px;padding:10px;text-align:center}
.drop img{max-width:100%;max-height:300px;border-radius:8px;display:block;margin:0 auto 8px}
.range{display:flex;gap:10px;align-items:center}
.range input[type=range]{flex:1;accent-color:var(--acc)}
.range input[type=number]{width:96px;flex:0 0 96px}
.switch{display:flex;align-items:center;gap:8px}
.switch input{width:20px;height:20px;accent-color:var(--acc)}
.seed{display:flex;gap:6px}
.seed button{padding:9px 11px}
.seed button.on{border-color:var(--acc);color:var(--acc)}
/* bottom bar */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#0b0e13f0;backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
#bar .in{max-width:760px;margin:0 auto}
#bar .pri{flex:1;padding:14px;font-size:16px}
#bar select{width:74px;flex:0 0 74px}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .25s}
/* results & gallery */
.media img,.media video{width:100%;border-radius:10px;display:block;background:#000}
.acts{display:flex;gap:6px;margin-top:8px}
.acts>*{flex:1;text-align:center;text-decoration:none;color:inherit}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal .it{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#000;cursor:pointer}
.gal img,.gal video{width:100%;height:100%;object-fit:cover}
.gal .play{position:absolute;right:5px;bottom:5px;font-size:12px;background:#000a;border-radius:6px;padding:1px 5px}
#live{width:100%;border-radius:10px;margin-top:10px}
#progText{font-size:12px;color:var(--mute);margin-top:4px;min-height:1em;text-align:center}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.slot{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:6px}
.slot img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;background:#000}
.slot .row{margin-top:6px;gap:4px}
.slot .row button{padding:6px 8px;font-size:13px}
.slot .cap{font-size:12px;color:var(--mute);margin-top:4px}
.slot.add{display:flex;align-items:center;justify-content:center;min-height:120px;border-style:dashed;cursor:pointer;color:var(--mute)}
.job{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.job:first-of-type{border-top:0}
pre{white-space:pre-wrap;word-break:break-all;font:12px/1.4 ui-monospace,Consolas,monospace;background:#0a0c10;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:60vh;overflow:auto;margin:8px 0 0}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;text-align:center}
.stat div{background:var(--card2);border-radius:10px;padding:8px}
.stat b{display:block;font-size:18px}
/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:#000e;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.ov .media{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.ov .media img,.ov .media video{max-height:100%;width:auto;max-width:100%;object-fit:contain}
#login{align-items:center;justify-content:center;background:var(--bg)}
#login .card{width:100%;max-width:340px;text-align:center}
#login input{text-align:center;font-size:24px;letter-spacing:.3em;margin:14px 0}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.tagchip img{width:22px;height:22px;object-fit:cover;border-radius:4px;vertical-align:middle;margin-right:5px}
#filesOv #fGrid{flex:1;min-height:0;overflow:auto;align-content:start}
.it.sel{outline:3px solid var(--bad);outline-offset:-3px}
.it.sel::after{content:"✓";position:absolute;top:4px;left:6px;background:var(--bad);color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;font-size:13px;line-height:20px}
.it .fn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:4px;font-size:11px;color:var(--mute);word-break:break-all;text-align:center}
</style>
</head>
<body>

<header>
  <div class="pc">
    <span id="dot" class="dot"></span>
    <div class="t"><b id="pcState">Connecting…</b><span id="pcInfo">&nbsp;</span></div>
    <button id="startBtn" class="ok hide">▶ Start</button>
    <button id="stopBtn2" class="bad hide">⏻ Stop</button>
  </div>
  <div class="tabs">
    <button data-tab="create" class="on">Create</button>
    <button data-tab="result">Result<span id="jobBadge" class="badge hide"></span></button>
    <button data-tab="gallery">Gallery</button>
    <button data-tab="pc">PC</button>
  </div>
</header>

<main>
  <!-- CREATE -->
  <section id="tab-create">
    <div class="card">
      <h3>Workflow</h3>
      <div class="row" style="margin-top:6px">
        <div id="wfChips" class="chips grow"></div>
        <button id="fileBtn" title="Import API workflow JSON">＋</button>
        <input id="fileIn" type="file" accept=".json,application/json" class="hide">
      </div>
      <div id="saveBox" class="hide" style="margin-top:10px">
        <div class="mute">Imported from file. Save it on the PC?</div>
        <div class="row" style="margin-top:6px"><input id="saveName" type="text" placeholder="Name"><button id="saveBtn">Save</button></div>
      </div>
    </div>
    <div id="formMsg" class="card mute hide"></div>
    <div id="form"></div>
    <div class="row" style="margin:4px 0 12px">
      <button id="resetBtn">↺ Reset to workflow defaults</button>
      <span class="grow"></span>
      <button id="delWfBtn" class="bad hide">Delete workflow</button>
    </div>
  </section>

  <!-- RESULT -->
  <section id="tab-result" class="hide">
    <div class="card">
      <div class="row"><h3 class="grow" style="margin:0">Now</h3><button id="interruptBtn" class="bad">■ Stop current</button></div>
      <div id="status" class="mute" style="margin-top:8px">Idle</div>
      <div class="prog"><i id="progBar"></i></div>
      <img id="live" class="hide" alt="Live preview">
    </div>
    <div class="card hide" id="quickCard">
      <h3>Prompt &amp; run</h3>
      <textarea id="quickPrompt" rows="3" placeholder="Change the prompt and run again…"></textarea>
      <div class="row" style="margin-top:8px"><span id="quickWf" class="mute grow"></span><button id="quickRun" class="pri">✦ Run</button></div>
    </div>
    <div class="card">
      <div class="row"><h3 class="grow" style="margin:0">Queue</h3><button id="clearQBtn">Clear waiting</button></div>
      <div id="queueList" class="mute" style="margin-top:6px">Empty</div>
    </div>
    <div id="results"></div>
  </section>

  <!-- GALLERY -->
  <section id="tab-gallery" class="hide">
    <div class="row" style="margin:12px 0"><span class="mute grow">Recent outputs · tap to open</span><button id="galRefresh">↻</button></div>
    <div id="gal" class="gal"></div>
  </section>

  <!-- PC -->
  <section id="tab-pc" class="hide">
    <div class="card">
      <h3>ComfyUI</h3>
      <div class="row" style="margin-top:8px">
        <button id="startBtn3" class="ok grow">▶ Start</button>
        <button id="restartBtn" class="grow">⟳ Restart</button>
        <button id="stopBtn3" class="bad grow">⏻ Stop</button>
      </div>
    </div>
    <div class="card">
      <h3>GPU</h3>
      <div id="gpuName" class="mute" style="margin-bottom:8px">—</div>
      <div class="stat">
        <div><b id="gUtil">–</b><span class="mute">Load</span></div>
        <div><b id="gMem">–</b><span class="mute">VRAM</span></div>
        <div><b id="gRam">–</b><span class="mute">RAM</span></div>
        <div><b id="gTemp">–</b><span class="mute">GPU temp</span></div>
      </div>
      <div id="commitInfo" class="mute" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <div class="row"><h3 class="grow" style="margin:0">ComfyUI log</h3><label class="switch mute"><input id="logAuto" type="checkbox" checked> live</label><button id="logBtn">↻</button></div>
      <pre id="log">…</pre>
    </div>
    <div class="card">
      <h3>Files on PC</h3>
      <div class="row" style="margin-top:8px">
        <button class="grow" data-files="input">📥 Inputs <span id="fcInput" class="mute"></span></button>
        <button class="grow" data-files="output">📤 Outputs <span id="fcOutput" class="mute"></span></button>
      </div>
    </div>
    <div class="card mute" id="apiKeyInfo"></div>
  </section>
</main>

<div id="bar"><div class="in">
  <div class="row">
    <select id="runCount" title="How many runs"><option>1</option><option>2</option><option>3</option><option>4</option><option>6</option><option>8</option></select>
    <button id="runBtn" class="pri">✦ Generate</button>
  </div>
  <div class="prog"><i id="progBar2"></i></div>
  <div id="progText"></div>
</div></div>
<input id="slotFile" type="file" accept="image/*" class="hide">

<div id="filesOv" class="ov hide">
  <div class="row"><b id="fTitle" class="grow"></b><button id="fClose">✕</button></div>
  <div class="row" style="margin:8px 0"><span id="fInfo" class="mute grow"></span><button id="fSelMode">☑ Select</button><button id="fSelAll" class="hide">Select all</button></div>
  <div id="fGrid" class="gal"></div>
  <div class="mute" id="fHint" style="margin-top:8px">Tap a file to open / play it.</div>
  <div class="row" style="margin-top:8px"><button id="fDelSel" class="bad grow hide" disabled>🗑 Delete selected</button><button id="fDelAll" class="bad">Delete all</button></div>
</div>

<div id="viewer" class="ov hide">
  <div class="row"><span id="vName" class="mute grow" style="overflow:hidden;text-overflow:ellipsis"></span><button id="vClose">✕</button></div>
  <div class="media" id="vMedia"></div>
  <div class="acts"><a id="vSave" download><button style="width:100%">⬇ Save</button></a><button id="vReuse">↺ Use as input</button><button id="vDel" class="bad" style="flex:0 0 auto">🗑</button></div>
</div>

<div id="login" class="ov hide">
  <div class="card">
    <h3>Comfy Remote</h3>
    <div class="mute">Enter the PIN from config.json on your PC</div>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="32">
    <button id="loginBtn" class="pri" style="width:100%;padding:12px">Unlock</button>
    <div id="loginErr" class="err" style="margin-top:10px"></div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const C = '/comfy';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k, d = null){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const clientId = store.get('cr:cid') || ('cr-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
store.set('cr:cid', clientId);

function toast(msg, ms = 2500){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), ms);
}

// ---------------------------------------------------------------- HTTP
async function api(path, opts = {}){
  const r = await fetch(path, { credentials: 'same-origin', ...opts });
  if (r.status === 401) { showLogin(); throw new Error('Login required'); }
  return r;
}
async function jget(path){
  const r = await api(path);
  if (!r.ok) throw new Error((await r.text()).slice(0, 300) || r.status);
  return r.json();
}
async function jpost(path, body, method = 'POST'){
  const r = await api(path, { method, headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
  const txt = await r.text();
  let j; try { j = JSON.parse(txt); } catch { j = { error: txt }; }
  if (!r.ok) { const e = new Error(typeof j.error === 'string' ? j.error : (j.error && j.error.message) || txt || r.status); e.body = j; throw e; }
  return j;
}

// ---------------------------------------------------------------- login
function showLogin(){ $('#login').classList.remove('hide'); setTimeout(() => $('#pin').focus(), 50); }
async function doLogin(){
  $('#loginErr').textContent = '';
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: $('#pin').value }) });
  if (!r.ok) { $('#loginErr').textContent = await r.text(); return; }
  $('#login').classList.add('hide'); $('#pin').value = '';
  boot();
}
$('#loginBtn').onclick = doLogin;
$('#pin').onkeydown = e => { if (e.key === 'Enter') doLogin(); };

// ---------------------------------------------------------------- PC status
let pcState = null;
async function pollStatus(){
  try {
    const s = await jget('/api/status');
    const prev = pcState; pcState = s.state;
    $('#dot').className = 'dot ' + s.state;
    $('#pcState').textContent = { running: 'ComfyUI running', starting: 'ComfyUI starting…', stopped: 'ComfyUI stopped' }[s.state];
    const g = s.gpu, ram = s.ram;
    const parts = [];
    if (g) parts.push(`GPU ${g.util}%`, `VRAM ${(g.mem_used / 1024).toFixed(1)}/${(g.mem_total / 1024).toFixed(0)} GB`);
    if (ram) parts.push(`RAM ${ram.used}/${Math.round(ram.total)} GB`);
    if (g) parts.push(`${g.temp}°C`);
    $('#pcInfo').textContent = s.exit_code != null && s.state === 'stopped' ? `Exited with code ${s.exit_code}. See PC → log` : (parts.join(' · ') || ' ');
    if (ram) {
      $('#gRam').textContent = `${ram.used}/${Math.round(ram.total)} GB`;
      $('#commitInfo').textContent = `RAM + page file in use: ${ram.commit_used} / ${Math.round(ram.commit_total)} GB` +
        (ram.commit_used > ram.total ? ' · spilling to SSD (slower)' : '');
    }
    if (g) {
      $('#gpuName').textContent = g.name;
      $('#gUtil').textContent = g.util + '%';
      $('#gMem').textContent = `${(g.mem_used / 1024).toFixed(1)}/${(g.mem_total / 1024).toFixed(0)} GB`;
      $('#gTemp').textContent = g.temp + '°';
    }
    $('#apiKeyInfo').innerHTML = s.api_key
      ? '✓ Comfy.org API key is set on the PC (needed for MiniMax / other API nodes).'
      : 'ℹ No Comfy.org API key in config.json. Local models work; API nodes like MiniMax need <b>comfy_api_key</b>.';
    const running = s.state === 'running';
    $('#startBtn').classList.toggle('hide', s.state !== 'stopped');
    $('#stopBtn2').classList.toggle('hide', s.state === 'stopped');
    $('#startBtn3').disabled = s.state !== 'stopped';
    $('#stopBtn3').disabled = $('#restartBtn').disabled = s.state === 'stopped';
    $('#runBtn').disabled = !running || !wf;
    if (running && prev !== 'running') onComfyUp();
    if (!running) showFormMsg(s.state === 'starting' ? 'ComfyUI is starting… (models load on first run, this can take a minute)' : 'ComfyUI is stopped. Tap ▶ Start at the top.');
  } catch (e) {
    if (e.message !== 'Login required') { $('#dot').className = 'dot'; $('#pcState').textContent = 'PC not reachable'; $('#pcInfo').textContent = `Is the PC on, launcher running, Tailscale connected? (${e.message})`; }
  }
}
async function pcAction(a){
  if (a === 'stop' && !confirm('Stop ComfyUI? Running jobs will be cancelled.')) return;
  try { const r = await jpost('/api/' + a); toast('ComfyUI: ' + r.result); } catch (e) { toast(e.message, 5000); }
  pollStatus();
}
$('#startBtn').onclick = $('#startBtn3').onclick = () => pcAction('start');
$('#stopBtn2').onclick = $('#stopBtn3').onclick = () => pcAction('stop');
$('#restartBtn').onclick = () => pcAction('restart');

async function loadLog(){
  try { const r = await api('/api/log?lines=300'); const pre = $('#log'); const atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30;
    pre.textContent = await r.text(); if (atEnd) pre.scrollTop = pre.scrollHeight; } catch {}
}
$('#logBtn').onclick = loadLog;

// ---------------------------------------------------------------- workflows
let ui = {}, wfNames = [], wfName = null, wf = null, specs = {}, fields = [], vals = {}, seedMode = {};

async function loadWorkflowList(select){
  wfNames = await jget('/api/workflows');
  const want = select || store.get('cr:last');
  renderChips();
  const name = wfNames.includes(want) ? want : wfNames[0];
  if (name) await selectWorkflow(name);
  else showFormMsg('No workflows yet. In ComfyUI on the PC: Workflow → Export (API), save the file into comfy-remote\\workflows, or tap ＋ to import it here.');
}
function renderChips(){
  $('#wfChips').innerHTML = wfNames.map(n => `<button data-wf="${esc(n)}" class="${n === wfName ? 'on' : ''}">${esc(n)}</button>`).join('')
    || '<span class="mute">No workflows</span>';
}
$('#wfChips').onclick = e => { const b = e.target.closest('[data-wf]'); if (b) selectWorkflow(b.dataset.wf); };

async function selectWorkflow(name){
  const base = '/api/workflows/' + encodeURIComponent(name);
  const [j, u] = await Promise.all([jget(base), jget(base + '/ui').catch(() => ({}))]);
  store.set('cr:last', name);
  $('#saveBox').classList.add('hide');
  $('#delWfBtn').classList.remove('hide');
  await setWorkflow(name, j, u);
}
async function setWorkflow(name, j, u = {}){
  wfName = name; wf = j; ui = u || {};
  vals = store.get('cr:v:' + name, {});
  seedMode = store.get('cr:s:' + name, {});
  renderChips();
  $('#runBtn').disabled = pcState !== 'running';
  if (pcState === 'running') await buildForm();
}
function isApi(j){

// ---------------------------------------------------------------- form
const MAIN_KEYS = /^(seed|noise_seed|steps|cfg|sampler_name|scheduler|guidance|denoise|width|height|length|duration|fps|frame_rate|batch_size|megapixels|shift|resolution|aspect_ratio|strength|upscale_by|prompt_optimizer)$/i;
const MODEL_KEYS = /^(ckpt|unet|clip|clip_vision|vae|lora|control_net|style_model|upscale_model|model)(_name)?\d*$/i;

function specOf(ct, key){
  const s = specs[ct]; if (!s || !s.input) return null;
  const raw = (s.input.required && s.input.required[key]) || (s.input.optional && s.input.optional[key]);
  if (!raw) return null;
  const [t, o = {}] = raw;
  if (Array.isArray(t)) return { type: 'COMBO', options: t, o };
  if (t === 'COMBO') return { type: 'COMBO', options: o.options || [], o };
  return { type: t, o };
}

function classify(node, key, val, sp){
  if (Array.isArray(val)) return null;                                     // wired to another node
  const ct = node.class_type;
  if (key === 'image' && ((sp && sp.o.image_upload) || /^LoadImage/.test(ct))) return 'image';
  if (sp && sp.type === 'COMBO') return 'combo';
  if (/seed/i.test(key) && typeof val === 'number') return 'seed';
  if (typeof val === 'string' && ((sp && sp.o.multiline) || /TextEncode|Prompt/i.test(ct) || /^(text|prompt|positive|negative)/i.test(key))) return 'prompt';
  if (typeof val === 'boolean') return 'bool';
  if (typeof val === 'number') return 'num';
  if (typeof val === 'string') return 'str';
  return null;
}

function showFormMsg(msg){
  const m = $('#formMsg');
  if (msg) { m.textContent = msg; m.classList.remove('hide'); $('#form').classList.add('hide'); }
  else { m.classList.add('hide'); $('#form').classList.remove('hide'); }
}

async function buildForm(){
  showFormMsg('Loading workflow…');
  const classes = [...new Set(Object.values(wf).map(n => n.class_type))].filter(c => !(c in specs));
  await Promise.all(classes.map(async c => {
    try { const j = await jget(C + '/object_info/' + encodeURIComponent(c)); specs[c] = j[c] || null; } catch { specs[c] = null; }
  }));
  const missing = Object.values(wf).map(n => n.class_type).filter(c => !specs[c]);
  const titleOf = id => (wf[id]._meta && wf[id]._meta.title) || wf[id].class_type;
  const hidden = new Set((ui.hide || []).map(h => h.join('|')));
  const S = ui.imageSlots;
  if (S) for (const id of S.nodes) hidden.add(id);
  const taken = new Set();
  fields = [];
  for (const h of ui.fields || []) {                    // curated fields from <workflow>.ui.json
    const t = (h.t || []).filter(([id, key]) => wf[id] && wf[id].inputs && key in wf[id].inputs && !Array.isArray(wf[id].inputs[key]));
    if (!t.length) continue;
    const [id, key] = t[0], node = wf[id], val = node.inputs[key], sp = specOf(node.class_type, key);
    const kind = h.kind || classify(node, key, val, sp);
    if (!kind) continue;
    for (const [i, k] of t) taken.add(i + '|' + k);
    fields.push({ k: id + '|' + key, targets: t, tpl: h.tpl || [], id, key, kind, title: titleOf(id), label: h.label, help: h.help,
      group: h.group || 'Settings', orig: val, sp, lim: { min: h.min, max: h.max, step: h.step } });
  }
  const curated = fields.length > 0;
  for (const [id, node] of Object.entries(wf)) {
    if (hidden.has(id)) continue;
    for (const [key, val] of Object.entries(node.inputs || {})) {
      const k = id + '|' + key;
      if (taken.has(k) || hidden.has(k)) continue;
      const sp = specOf(node.class_type, key);
      const kind = classify(node, key, val, sp);
      if (kind) fields.push({ k, targets: [[id, key]], id, key, kind, title: titleOf(id), orig: val, sp, auto: true });
    }
  }
  let groups;
  if (curated) {
    const order = [...new Set(fields.filter(f => !f.auto).map(f => f.group))];
    groups = [...order.map(g => [g, fields.filter(f => !f.auto && f.group === g)]), ['Advanced', fields.filter(f => f.auto)]];
  } else {
    const pick = fn => fields.filter(f => !f.g && fn(f) && (f.g = true));
    groups = [
      ['Images', pick(f => f.kind === 'image')],
      ['Prompts', pick(f => f.kind === 'prompt')],
      ['Settings', pick(f => MAIN_KEYS.test(f.key) || f.kind === 'seed')],
      ['Models', pick(f => f.kind === 'combo' && MODEL_KEYS.test(f.key))],
      ['Advanced', pick(() => true)],
    ];
  }
  let html = ui.note ? `<div class="card mute">ℹ ${esc(ui.note)}</div>` : '';
  if (ui.presets) html += '<div class="card" id="presetCard"></div>';
  if (S) html += '<div class="card" id="slotCard"></div>';
  if (ui.inputScale) html += '<div class="card" id="scaleCard"></div>';
  html += missing.length ? `<div class="card err">⚠ ComfyUI doesn't know these nodes: ${esc([...new Set(missing)].join(', '))}. Install them on the PC (ComfyUI Manager) or this workflow will fail.</div>` : '';
  for (const [name, list] of groups) {
    if (!list.length) continue;
    const inner = list.map(fieldHtml).join('');
    const closedByDefault = name === 'Advanced' || (name === 'Models' && curated);
    const open = folded[name] === undefined ? !closedByDefault : !folded[name];
    html += `<div class="card"><details data-grp="${esc(name)}"${open ? ' open' : ''}><summary>${esc(name)} (${list.length})</summary>${inner}</details></div>`;
  }
  $('#form').innerHTML = html || '<div class="card mute">This workflow has no editable inputs.</div>';
  showFormMsg(null);
  for (const f of fields) if (f.kind === 'image') showInputPreview(f);
  if (S) renderSlots();
  if (ui.promptTemplate) renderPtpl();
  if (ui.presets) renderPresets();
  if (ui.inputScale) renderScale();
  $('#runBtn').disabled = pcState !== 'running';
  updateQuick();
}

// Rewire the prompt for the chosen number of photos
function applySlots(p){
  const S = ui.imageSlots; if (!S) return;
  const list = slotList();
  const fmt = (pat, n) => pat.replace('{n0}', n - 1).replace('{n}', n);
  const idOf = i => S.nodes[i] || 'cr_img_' + (i + 1);
  S.nodes.forEach((id, i) => { if (i >= list.length) delete p[id]; });
  list.forEach((name, i) => { p[idOf(i)] = { class_type: 'LoadImage', inputs: { image: name }, _meta: { title: 'Photo ' + (i + 1) } }; });
  for (const [nid, pat, minFill] of S.targets) {
    if (!p[nid]) continue;
    for (let n = 1; n <= S.max + 1; n++) delete p[nid].inputs[fmt(pat, n)];
    if (!list.length) continue;
    const count = Math.max(list.length, minFill || 0);
    for (let n = 1; n <= count; n++) p[nid].inputs[fmt(pat, n)] = [idOf(Math.min(n, list.length) - 1), 0];
  }
  if (!list.length && S.empty) {

    for (const id of S.empty.remove || []) delete p[id];
    for (const [nid, k] of S.empty.drop || []) if (p[nid]) delete p[nid].inputs[k];
  }
}

function fieldHtml(f){

      return label + `<textarea data-k="${k}" rows="4" placeholder="Describe what you want…">${esc(v)}</textarea>`;
    case 'seed': {

      return label + `<div class="seed"><input type="number" data-k="${k}" value="${esc(v)}" step="1" class="grow">
        <button type="button" data-seed="${k}" data-mode="random" class="${m === 'random' ? 'on' : ''}" title="New random seed each run">🎲</button>
        <button type="button" data-seed="${k}" data-mode="fixed" class="${m === 'fixed' ? 'on' : ''}" title="Keep this seed">📌</button></div>`;
    }
    case 'combo': {
      const opts = f.sp.options.map(x => typeof x === 'object' ? (x.content ?? x.value ?? JSON.stringify(x)) : x);
      const list = opts.includes(v) ? opts : [v, ...opts];
      return label + `<select data-k="${k}">${list.map(x => `<option value="${esc(x)}"${x === v ? ' selected' : ''}>${esc(x)}${opts.includes(x) ? '' : ' ⚠ missing'}</option>`).join('')}</select>`;
    }

      return label + `<label class="switch"><input type="checkbox" data-k="${k}"${v ? ' checked' : ''}> <span class="mute">${v ? 'on' : 'off'}</span></label>`;
    case 'num': {
      const isInt = f.sp ? f.sp.type === 'INT' : Number.isInteger(f.orig);
      const step = o.step ?? o.round ?? (isInt ? 1 : 0.01);
      const hasRange = o.min !== undefined && o.max !== undefined && o.max - o.min <= 100000 && o.max - o.min > 0;
      const attrs = `step="${step}"${o.min !== undefined ? ` min="${o.min}"` : ''}${o.max !== undefined ? ` max="${o.max}"` : ''}`;

// Downscale huge phone photos (> 4096 px) before upload
async function shrink(file){
  try {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
    const bmp = await createImageBitmap(file);
    const max = 4096, sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (sc === 1) return file;
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', 0.92));
  } catch { return file; }
}

}

function formatError(e){
  const j = e.body || {};
  let s = (j.error && (j.error.message || j.error)) || e.message || 'Error';

  for (const [id, ne] of Object.entries(j.node_errors || {})) {
    const t = (wf && wf[id] && wf[id]._meta && wf[id]._meta.title) || ne.class_type || id;
    for (const x of ne.errors || []) s += `\n• ${t}: ${x.message}${x.details ? ' (' + x.details + ')' : ''}`;
  }
  return s;
}
function setStatus(t, bad){ const s = $('#status'); s.textContent = t; s.className = bad ? 'err' : 'mute'; }
let pgs = { node: null };
const fmtTime = sec => sec < 60 ? Math.round(sec) + ' s' : Math.floor(sec / 60) + ' min ' + Math.round(sec % 60) + ' s';
function onProgress(d){
  const now = performance.now();
  if (pgs.node !== d.node || d.value < pgs.last) pgs = { node: d.node, t0: now, v0: d.value };
  pgs.last = d.value;
  const pct = Math.round(d.value / d.max * 100);
  let speed = '';
  if (d.value > pgs.v0) {
    const per = (now - pgs.t0) / (d.value - pgs.v0) / 1000;
    speed = ` · ${per < 1 ? (1 / per).toFixed(1) + ' it/s' : per.toFixed(1) + ' s/it'} · ~${fmtTime(per * (d.max - d.value))} left`;
  }
  const n = wf && wf[d.node];
  const title = (n && n._meta && n._meta.title) || (n && n.class_type) || 'Working';
  const txt = `${pct}% · step ${d.value}/${d.max}${speed}`;
  setStatus(`${title} · ${txt}`);
  $('#progText').textContent = txt;
  setProg(d.value / d.max);
}
function setProg(x){ const w = Math.round(Math.max(0, Math.min(1, x)) * 100) + '%'; $('#progBar').style.width = w; $('#progBar2').style.width = w; }

async function finishJob(id){
  const job = jobs[id]; if (!job || job.done) return;
  job.done = true; saveJobs();
  let item;
  for (let i = 0; i < 20 && !item; i++) {           // history is written right after the "done" message
    try { item = (await jget(C + '/history/' + id))[id]; } catch {}
    if (!item) await sleep(500);
  }
  if (!item) { setStatus('Finished, but result not found in history', true); return; }
  const st = item.status || {};
  if (st.status_str === 'error') {
    const m = (st.messages || []).find(x => x[0] === 'execution_error');
    setStatus('Error' + (m ? ` in ${m[1].node_type}: ${m[1].exception_message}` : ''), true);
    return;
  }
  const files = outputsOf(item);
  $('#progText').textContent = '';
  if (runningId === id || !runningId) { setStatus(files.length ? `Done · ${files.length} file(s)` : 'Done (no outputs; add a Save Image / Save Video node)'); setProg(1); $('#live').classList.add('hide'); }
  const texts = [];
  for (const out of Object.values(item.outputs || {})) if (Array.isArray(out.text)) texts.push(...out.text.filter(t => typeof t === 'string' && t.length > 30));
  $('#results').insertAdjacentHTML('afterbegin', files.map(x => resultCard(x, job.wf)).join('') +
    texts.map(t => `<div class="card"><details><summary>Text output</summary><pre>${esc(t)}</pre></details></div>`).join(''));
  if (document.hidden && navigator.vibrate) navigator.vibrate(200);
  loadQueue();
}

// ---------------------------------------------------------------- websocket
let ws = null;
function connect(){
  if (ws && ws.readyState <= 1) return;
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + C + '/ws?clientId=' + encodeURIComponent(clientId));
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => loadQueue();
  ws.onmessage = e => {
    if (typeof e.data !== 'string') return onBinary(e.data);
    let m; try { m = JSON.parse(e.data); } catch { return; }
    const d = m.data || {};
    switch (m.type) {
      case 'status': loadQueue(); break;
      case 'execution_start': if (jobs[d.prompt_id]) { runningId = d.prompt_id; setStatus(`Running · ${jobs[d.prompt_id].wf}`); setProg(0); } break;
      case 'progress': if (d.max && (!d.prompt_id || d.prompt_id === runningId)) onProgress(d); break;
      case 'progress_state': break;
      case 'executing':
        if (!jobs[d.prompt_id]) break;
        if (d.node === null) finishJob(d.prompt_id);
        else { const n = wf && wf[d.node]; setStatus('Running · ' + ((n && n._meta && n._meta.title) || (n && n.class_type) || 'node ' + d.node)); }
        break;
      case 'execution_success': if (jobs[d.prompt_id]) finishJob(d.prompt_id); break;
      case 'execution_error':
        if (jobs[d.prompt_id]) { jobs[d.prompt_id].done = true; saveJobs(); setStatus(`Error in ${d.node_type || d.node_id}: ${d.exception_message}`, true); loadQueue(); }
        break;
      case 'execution_interrupted':
        if (jobs[d.prompt_id]) { jobs[d.prompt_id].done = true; saveJobs(); setStatus('Stopped', true); setProg(0); $('#progText').textContent = ''; loadQueue(); }
        break;
    }
  };
  ws.onclose = () => { ws = null; setTimeout(connect, 2500); };
}

function onBinary(buf){
  if (buf.byteLength < 8) return;
  const v = new DataView(buf), type = v.getUint32(0);
  if (type === 1) {                                       // live preview image
    const img = $('#live');
    if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
    img.src = URL.createObjectURL(new Blob([buf.slice(8)], { type: v.getUint32(4) === 2 ? 'image/png' : 'image/jpeg' }));
    img.classList.remove('hide');
  } else if (type === 3) {                                // text progress (API nodes such as MiniMax)
    const len = v.getUint32(4);
    const text = new TextDecoder().decode(buf.slice(8 + len)).trim();
    if (text) setStatus(text.split('\n').slice(-2).join(' · '));
  }
}

function renderFiles(){
  const thumb = f => {
    const i = f.path.lastIndexOf('/');
    const u = C + '/view?' + new URLSearchParams({ filename: f.path.slice(i + 1), subfolder: i < 0 ? '' : f.path.slice(0, i), type: fDir });
    if (pcState === 'running' && /\.(png|jpe?g|webp|gif)$/i.test(f.path)) return `<img src="${u}" loading="lazy" alt="" onerror="this.remove()">`;
    if (pcState === 'running' && isVideo(f.path)) return `<video src="${u}#t=0.1" preload="metadata" muted playsinline></video><span class="play">▶</span>`;
    return '';
  };
  $('#fGrid').innerHTML = fList.length ? fList.slice(0, 400).map((f, i) =>
    `<div class="it${fSel.has(f.path) ? ' sel' : ''}" data-fi="${i}"><span class="fn">${esc(f.path)}</span>${thumb(f)}</div>`).join('')
    : '<div class="mute">No files</div>';
  $('#fDelSel').disabled = !fSel.size;
  $('#fDelSel').textContent = fSel.size ? `🗑 Delete selected (${fSel.size})` : '🗑 Delete selected';
  $('#fSelAll').textContent = fSel.size && fSel.size === fList.length ? 'Select none' : 'Select all';
}
$('#fGrid').onclick = e => {
  const it = e.target.closest('[data-fi]'); if (!it) return;
  const p = fList[+it.dataset.fi].path;
  if (!fSelMode) {
    const i = p.lastIndexOf('/');
    return openViewer({ filename: p.slice(i + 1), subfolder: i < 0 ? '' : p.slice(0, i), type: fDir }, () => { openFiles(fDir); loadFileCounts(); });
  }
  fSel.has(p) ? fSel.delete(p) : fSel.add(p);
  it.classList.toggle('sel', fSel.has(p));
  $('#fDelSel').disabled = !fSel.size;
  $('#fDelSel').textContent = fSel.size ? `🗑 Delete selected (${fSel.size})` : '🗑 Delete selected';
};
$('#fSelAll').onclick = () => { fSel = fSel.size === fList.length ? new Set() : new Set(fList.map(f => f.path)); renderFiles(); };
async function deleteFiles(body, what){
  if (!confirm(`Permanently delete ${what} from the PC (${fDir} folder)?`)) return;
  try {
    const r = await jpost('/api/files/delete', { dir: fDir, ...body });
    toast(`Deleted ${r.deleted} file(s), freed ${fmtBytes(r.freed)}`);
    await openFiles(fDir); loadFileCounts();
  } catch (e) { toast(e.message, 5000); }
}
$('#fDelSel').onclick = () => deleteFiles({ paths: [...fSel] }, `${fSel.size} file(s)`);
$('#fDelAll').onclick = () => deleteFiles({ all: true }, `ALL ${fList.length} file(s)`);
$('#fClose').onclick = () => { $('#filesOv').classList.add('hide'); $('#fGrid').innerHTML = ''; };
for (const b of $$('[data-files]')) b.onclick = () => openFiles(b.dataset.files);

// ---------------------------------------------------------------- tabs / boot
let tab = 'create';
function showTab(t){
  tab = t;
  for (const b of $$('.tabs button')) b.classList.toggle('on', b.dataset.tab === t);
  for (const s of ['create', 'result', 'gallery', 'pc']) $('#tab-' + s).classList.toggle('hide', s !== t);
  if (t === 'gallery') loadGallery().catch(() => {});
  if (t === 'pc') { loadLog(); loadFileCounts(); }
  if (t === 'result') { loadQueue(); updateQuick(); }
}
for (const b of $$('.tabs button')) b.onclick = () => showTab(b.dataset.tab);

let timers = [];
async function boot(){
  timers.forEach(clearInterval);
  await pollStatus();
  try { await loadWorkflowList(); } catch {}
  connect();
  saveJobs();
  timers = [
    setInterval(() => { if (!document.hidden) pollStatus(); }, 3000),
    setInterval(() => { if (!document.hidden && tab === 'pc' && $('#logAuto').checked) loadLog(); }, 4000),
  ];
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { pollStatus(); connect(); loadQueue(); } });
if (location.protocol === 'file:') {
  document.body.innerHTML = '<div class="card" style="margin-top:40px"><h3>Open it through the launcher</h3><p>This page only works via the link, not as a file.</p><p>On the PC: <b>http://127.0.0.1:8190</b><br>On the phone (Tailscale): <b>http://&lt;pc-name&gt;:8190</b></p></div>';
} else boot();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Comfy Remote</title>
<style>
:root{--bg:#111418;--card:#1b2027;--line:#2a313b;--text:#e8ecf1;--mute:#8a94a3;--acc:#6ea8fe;--ok:#4cc38a;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 12px 96px;max-width:720px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],input[type=number],textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:110px;resize:vertical}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.card h3{margin:0 0 6px;font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
label.f{display:block;margin:10px 0 4px;font-size:13px;color:var(--mute)}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
button{background:var(--line);border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
button.pri{background:var(--acc);color:#0b1220;font-weight:600}
button:disabled{opacity:.5}
.tabs{display:flex;gap:6px;margin-top:8px}
.tabs button{flex:1;padding:8px}
.tabs button.on{background:var(--acc);color:#0b1220}
.drop{border:1px dashed var(--line);border-radius:12px;padding:10px;text-align:center;color:var(--mute)}
.drop img{max-width:100%;max-height:260px;border-radius:8px;display:block;margin:0 auto 8px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#0d1014f2;border-top:1px solid var(--line)}
#bar .in{max-width:720px;margin:0 auto}
#bar .row .pri{flex:1;padding:14px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.res img,.res video{width:100%;border-radius:10px;display:block}
.res .row{margin:6px 0 14px}
.res .row>*{flex:1;text-align:center;text-decoration:none;color:inherit}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}
details summary{cursor:pointer;color:var(--mute);padding:4px 0}
.mute{color:var(--mute);font-size:13px}
.err{color:var(--bad);white-space:pre-wrap}
.hide{display:none}
#live{max-width:100%;border-radius:10px;margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="row">
    <select id="wfSel" aria-label="Workflow"></select>
    <button id="fileBtn" title="Open API workflow JSON">📂</button>
    <input id="fileIn" type="file" accept=".json,application/json" class="hide">
  </div>
  <div class="tabs">
    <button data-tab="edit" class="on">Edit</button>
    <button data-tab="result">Result</button>
    <button data-tab="gallery">Gallery</button>
  </div>
</header>

<main>
  <section id="tab-edit">
    <div id="saveBox" class="card hide">
      <div class="mute">Loaded from file. Save it to the PC so it appears in the list?</div>
      <div class="row" style="margin-top:8px"><input id="saveName" type="text" placeholder="Name"><button id="saveBtn">Save</button></div>
    </div>
    <div id="form"></div>
    <div class="row" style="margin-top:6px"><button id="resetBtn">Reset values</button></div>
  </section>

  <section id="tab-result" class="hide">
    <div class="card">
      <h3>Status</h3>
      <div id="status" class="mute">Idle</div>
      <div class="prog"><i id="progBar"></i></div>
      <img id="live" class="hide" alt="Live preview">
    </div>
    <div id="results" class="res"></div>
  </section>

  <section id="tab-gallery" class="hide">
    <div class="row" style="margin:10px 0"><button id="galRefresh">Refresh</button><span class="mute">Tap an image to use it as input</span></div>
    <div id="gal" class="gal"></div>
  </section>
</main>

<div id="bar"><div class="in">
  <div class="row">
    <button id="runBtn" class="pri">▶ Generate</button>
    <button id="stopBtn" title="Interrupt">■</button>
  </div>
  <div id="queue" class="mute" style="margin-top:4px"></div>
</div></div>

<script>
const $ = s => document.querySelector(s);
const clientId = (self.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'cr-' + Date.now().toString(36) + Math.random().toString(36).slice(2);
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const clone = o => (self.structuredClone ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let wfName = null, wf = null, fields = [], vals = {}, rnd = {};
let currentId = null, finished = false;

// ---------- workflow list ----------
async function loadList(select){
  const names = await (await fetch('/remote/workflows')).json();
  const sel = $('#wfSel');
  sel.innerHTML = names.length ? names.map(n => `<option>${esc(n)}</option>`).join('')
    : '<option value="">No workflows yet, tap 📂</option>';
  const want = select || store.get('cr:last');
  if (want && names.includes(want)) sel.value = want;
  if (sel.value) await loadWorkflow(sel.value);
}

function isApi(j){
  return j && typeof j === 'object' && !Array.isArray(j) && !j.nodes &&
    Object.keys(j).length > 0 && Object.values(j).every(n => n && n.class_type);
}

async function loadWorkflow(name){
  const j = await (await fetch('/remote/workflows/' + encodeURIComponent(name))).json();
  setWorkflow(name, j);
  store.set('cr:last', name);
  $('#saveBox').classList.add('hide');
}

function setWorkflow(name, j){
  wfName = name; wf = j;
  vals = store.get('cr:v:' + name) || {};
  rnd = store.get('cr:r:' + name) || {};
  buildForm();
}

// ---------- form ----------
const MAIN = /^(steps|cfg|denoise|width|height|batch_size|megapixels|shift|strength|length|fps)$/;

function classify(node, key, val){
  const ct = node.class_type;
  if (Array.isArray(val)) return null;                 // link to another node
  if (/^LoadImage/.test(ct) && key === 'image') return 'image';
  if (/seed/i.test(key) && typeof val === 'number') return 'seed';
  if (typeof val === 'string' && (/TextEncode|Prompt/i.test(ct) || /^(text|prompt|positive|negative)/i.test(key))) return 'prompt';
  if (typeof val === 'boolean') return 'bool';
  if (typeof val === 'number') return 'num';
  if (typeof val === 'string') return 'str';
  return null;
}

function buildForm(){
  fields = [];
  for (const [id, node] of Object.entries(wf)) {
    const title = (node._meta && node._meta.title) || node.class_type;
    for (const [key, val] of Object.entries(node.inputs || {})) {
      const kind = classify(node, key, val);
      if (kind) fields.push({ k: id + '|' + key, id, key, kind, title, orig: val });
    }
  }
  const groups = {
    image: fields.filter(f => f.kind === 'image'),
    prompt: fields.filter(f => f.kind === 'prompt'),
    main: fields.filter(f => f.kind === 'seed' || (f.kind === 'num' && MAIN.test(f.key))),
  };
  const used = new Set([...groups.image, ...groups.prompt, ...groups.main]);
  groups.adv = fields.filter(f => !used.has(f));

  const card = (h, list) => list.length ? `<div class="card"><h3>${h}</h3>${list.map(fieldHtml).join('')}</div>` : '';
  $('#form').innerHTML =
    card('Images', groups.image) + card('Prompts', groups.prompt) + card('Settings', groups.main) +
    (groups.adv.length ? `<div class="card"><details><summary>Advanced (${groups.adv.length})</summary>${groups.adv.map(fieldHtml).join('')}</details></div>` : '') +
    (fields.length ? '' : '<div class="card mute">No editable inputs found.</div>');

  for (const f of groups.image) showInputPreview(f);
}

function cur(f){ return f.k in vals ? vals[f.k] : f.orig; }

function fieldHtml(f){
  const v = cur(f), k = esc(f.k);
  const label = `<label class="f">${esc(f.title)} · ${esc(f.key)}</label>`;
  switch (f.kind) {
    case 'image':
      return label + `<div class="drop"><img data-prev="${k}" alt="" class="hide">
        <div class="mute" data-name="${k}">${esc(v)}</div>
        <div class="row" style="margin-top:8px;justify-content:center">
          <button type="button" onclick="this.nextElementSibling.click()">Choose image</button><input type="file" accept="image/*" class="hide" data-up="${k}">
        </div></div>`;
    case 'prompt':
      return label + `<textarea data-k="${k}">${esc(v)}</textarea>`;
    case 'seed':
      return label + `<div class="row"><input type="number" data-k="${k}" value="${esc(v)}" step="1">
        <label class="row mute" style="flex:0 0 auto"><input type="checkbox" data-rnd="${k}" ${rnd[f.k] !== false ? 'checked' : ''}> 🎲</label></div>`;
    case 'bool':
      return label + `<label class="row"><input type="checkbox" data-k="${k}" ${v ? 'checked' : ''}> enabled</label>`;
    case 'num':
      return label + `<input type="number" data-k="${k}" value="${esc(v)}" step="${Number.isInteger(f.orig) ? 1 : 'any'}">`;
    default:
      return label + `<input type="text" data-k="${k}" value="${esc(v)}">`;
  }
}

function viewUrl(name, type){
  const i = name.lastIndexOf('/');
  const q = new URLSearchParams({ filename: i < 0 ? name : name.slice(i + 1), subfolder: i < 0 ? '' : name.slice(0, i), type });
  return '/view?' + q;
}

function showInputPreview(f){
  const img = document.querySelector(`[data-prev="${CSS.escape(f.k)}"]`);
  const v = cur(f);
  if (!img || !v) return;
  img.onload = () => img.classList.remove('hide');
  img.onerror = () => img.classList.add('hide');
  img.src = viewUrl(v, 'input') + '&t=' + Date.now();
}

function saveVals(){ store.set('cr:v:' + wfName, vals); store.set('cr:r:' + wfName, rnd); }

$('#form').addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.rnd) { rnd[t.dataset.rnd] = t.checked; return saveVals(); }
  const k = t.dataset.k; if (!k) return;
  vals[k] = t.type === 'checkbox' ? t.checked : t.type === 'number' ? Number(t.value) : t.value;
  saveVals();
});

$('#form').addEventListener('change', async e => {
  const k = e.target.dataset.up; if (!k || !e.target.files[0]) return;
  const file = e.target.files[0];
  const nameEl = document.querySelector(`[data-name="${CSS.escape(k)}"]`);
  nameEl.textContent = 'Uploading…';
  try {
    vals[k] = await upload(file, file.name || 'phone.jpg');
    saveVals();
    nameEl.textContent = vals[k];
    showInputPreview(fields.find(x => x.k === k));
  } catch (err) { nameEl.innerHTML = `<span class="err">${esc(err.message)}</span>`; }
  e.target.value = '';
});

async function upload(blob, name){
  const fd = new FormData();
  fd.append('image', blob, name);
  fd.append('overwrite', 'true');
  const r = await fetch('/upload/image', { method: 'POST', body: fd });
  if (!r.ok) throw new Error('Upload failed (' + r.status + ')');
  const j = await r.json();
  return j.subfolder ? j.subfolder + '/' + j.name : j.name;
}

$('#resetBtn').onclick = () => { if (!wf) return; vals = {}; rnd = {}; saveVals(); buildForm(); };

// ---------- run ----------
async function run(){
  if (!wf) return;
  const p = clone(wf);
  for (const f of fields) {
    if (f.kind === 'seed' && rnd[f.k] !== false) {
      vals[f.k] = Math.floor(Math.random() * 2 ** 48);
      const el = document.querySelector(`[data-k="${CSS.escape(f.k)}"]`);
      if (el) el.value = vals[f.k];
    }
    if (f.k in vals) p[f.id].inputs[f.key] = vals[f.k];
  }
  saveVals();
  setStatus('Sending…'); setProg(0);
  $('#live').classList.add('hide');
  showTab('result');
  try {
    const r = await fetch('/prompt', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: p, client_id: clientId }) });
    const j = await r.json();
    if (!r.ok || j.error) return setStatus(formatError(j), true);
    currentId = j.prompt_id; finished = false;
    setStatus('Queued (#' + j.number + ')');
  } catch (err) { setStatus('Cannot reach ComfyUI: ' + err.message, true); }
}

function formatError(j){
  let s = (j.error && (j.error.message || j.error)) || 'Error';
  for (const [id, ne] of Object.entries(j.node_errors || {})) {
    const t = (wf[id] && wf[id]._meta && wf[id]._meta.title) || ne.class_type || id;
    for (const e of ne.errors || []) s += `\n• ${t}: ${e.message}${e.details ? ' (' + e.details + ')' : ''}`;
  }
  return s;
}

function setStatus(t, bad){ const s = $('#status'); s.textContent = t; s.className = bad ? 'err' : 'mute'; }
function setProg(x){ $('#progBar').style.width = Math.round(x * 100) + '%'; }

async function finish(){
  if (finished || !currentId) return;
  finished = true; setProg(1);
  const id = currentId;
  let item;
  for (let i = 0; i < 20 && !item; i++) {          // history is written just after the "done" message
    item = (await (await fetch('/history/' + id)).json())[id];
    if (!item) await new Promise(r => setTimeout(r, 500));
  }
  if (!item) return setStatus('Finished, but no history found', true);
  const files = [];
  for (const out of Object.values(item.outputs || {}))
    for (const arr of Object.values(out)) if (Array.isArray(arr))
      for (const x of arr) if (x && x.filename) files.push(x);
  const shown = files.some(x => x.type === 'output') ? files.filter(x => x.type === 'output') : files;
  setStatus(shown.length ? `Done: ${shown.length} file(s)` : 'Done (no outputs)');
  $('#live').classList.add('hide');
  $('#results').innerHTML = shown.map(resultHtml).join('') + $('#results').innerHTML;
}

function fileUrl(x){ return '/view?' + new URLSearchParams({ filename: x.filename, subfolder: x.subfolder || '', type: x.type || 'output' }); }

function resultHtml(x){
  const u = fileUrl(x);
  const media = /\.(mp4|webm|mov)$/i.test(x.filename)
    ? `<video src="${u}" controls playsinline loop></video>` : `<img src="${u}" alt="">`;
  return `<div class="card">${media}<div class="row">
    <a href="${u}" download="${esc(x.filename)}"><button style="width:100%">⬇ Save</button></a>
    <button data-reuse="${esc(u)}" data-fn="${esc(x.filename)}">↺ Use as input</button></div></div>`;
}

async function reuse(url, fn){
  const f = fields.find(x => x.kind === 'image');
  if (!f) return alert('This workflow has no image input');
  const blob = await (await fetch(url)).blob();
  vals[f.k] = await upload(blob, fn);
  saveVals(); buildForm(); showTab('edit');
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-reuse]');
  if (b) reuse(b.dataset.reuse, b.dataset.fn).catch(err => alert(err.message));
});

$('#runBtn').onclick = run;
$('#stopBtn').onclick = () => fetch('/interrupt', { method: 'POST' });

// ---------- websocket ----------
function connect(){
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?clientId=' + clientId);
  ws.binaryType = 'arraybuffer';
  ws.onmessage = e => {
    if (typeof e.data !== 'string') return livePreview(e.data);
    const m = JSON.parse(e.data), d = m.data || {};
    const mine = d.prompt_id === undefined || d.prompt_id === currentId;
    switch (m.type) {
      case 'status': {
        const q = d.status && d.status.exec_info && d.status.exec_info.queue_remaining;
        $('#queue').textContent = q ? `Queue: ${q}` : '';
        break;
      }
      case 'execution_start': if (mine) setStatus('Running…'); break;
      case 'execution_cached': break;
      case 'progress': if (mine && d.max) setProg(d.value / d.max); break;
      case 'executing':
        if (d.prompt_id !== currentId) break;
        if (d.node === null) finish();
        else setStatus('Running: ' + (((wf && wf[d.node] && wf[d.node]._meta) || {}).title || d.node));
        break;
      case 'execution_success': if (d.prompt_id === currentId) finish(); break;
      case 'execution_error': if (d.prompt_id === currentId) { finished = true; setStatus('Error in ' + (d.node_type || d.node_id) + ': ' + d.exception_message, true); } break;
      case 'execution_interrupted': if (d.prompt_id === currentId) { finished = true; setStatus('Stopped', true); } break;
    }
  };
  ws.onclose = () => setTimeout(connect, 2000);
}

function livePreview(buf){
  const v = new DataView(buf);
  if (buf.byteLength < 9 || v.getUint32(0) !== 1) return;
  const img = $('#live');
  if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
  img.src = URL.createObjectURL(new Blob([buf.slice(8)], { type: v.getUint32(4) === 2 ? 'image/png' : 'image/jpeg' }));
  img.classList.remove('hide');
}

// ---------- gallery ----------
async function loadGallery(){
  const h = await (await fetch('/history?max_items=60')).json();
  const imgs = [];
  for (const item of Object.values(h).reverse())
    for (const out of Object.values(item.outputs || {}))
      for (const x of out.images || []) if (x.type === 'output') imgs.push(x);
  $('#gal').innerHTML = imgs.length ? imgs.map(x => {
    const u = fileUrl(x);
    return `<img src="${u}" loading="lazy" alt="" data-reuse="${esc(u)}" data-fn="${esc(x.filename)}">`;
  }).join('') : '<div class="mute">No images yet</div>';
}
$('#galRefresh').onclick = loadGallery;

// ---------- tabs / file open ----------
function showTab(t){
  for (const b of document.querySelectorAll('.tabs button')) b.classList.toggle('on', b.dataset.tab === t);
  for (const s of ['edit', 'result', 'gallery']) $('#tab-' + s).classList.toggle('hide', s !== t);
  if (t === 'gallery') loadGallery();
}
for (const b of document.querySelectorAll('.tabs button')) b.onclick = () => showTab(b.dataset.tab);

$('#wfSel').onchange = e => e.target.value && loadWorkflow(e.target.value);
$('#fileBtn').onclick = () => $('#fileIn').click();
$('#fileIn').onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  let j;
  try { j = JSON.parse(await file.text()); } catch { return alert('Not valid JSON'); }
  if (!isApi(j)) return alert('This is not an API-format workflow.\nIn ComfyUI use: Workflow → Export (API).');
  const name = file.name.replace(/\.json$/i, '');
  setWorkflow('file:' + name, j);
  $('#saveName').value = name;
  $('#saveBox').classList.remove('hide');
  e.target.value = '';
};
$('#saveBtn').onclick = async () => {
  const name = $('#saveName').value.trim();
  const r = await fetch('/remote/workflows/' + encodeURIComponent(name), {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(wf) });
  if (!r.ok) return alert(await r.text());
  store.set('cr:v:' + name, vals); store.set('cr:r:' + name, rnd);
  await loadList(name);
};

connect();
loadList().catch(err => setStatus('Cannot load workflows: ' + err.message, true));
</script>
</body>
</html>
